name: Sync classements FFF
on:
  schedule:
    # Toutes les 6 heures (08h, 14h, 20h, 02h UTC) — après les journées
    - cron: '0 8,14,20,2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Classement + calendrier (matchs futurs avec stade/GPS/heure) + effectif
      # La FFF est scrapée via SSR ; si le WAF bloque un passage, le script garde
      # la mémoire du run précédent (calendrier futurs) et le staff-input.json
      # garantit les stats individuelles (buts/passes) saisies par le coach.
      - name: Sync U16
        run: node tools/fetch-fff.mjs --cat u16
      - name: Sync U19
        run: node tools/fetch-fff.mjs --cat u19

      - name: Commit si modification
        run: |
          if ! git diff --quiet; then
            git config user.name "bot-classement"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "auto: sync classements U16+U19 (FFF) — $(date -u +%Y-%m-%d-%H)"
            git push
          else
            echo "Aucun changement."
          fi
