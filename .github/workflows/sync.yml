name: Sync classements FFF
# ⚠️ IMPORTANT : le scraping FFF est bloqué depuis GitHub Actions (WAF FFF
# bloque les IP de datacenter → 403). Les classements/calendriers/stats sont
# donc récupérés depuis l'environnement local (workspace) et poussés dans ce
# repo. Ce workflow ne fait QUE vérifier/commiter les données déjà présentes
# et régénérer l'index des médias — il ne scrape plus la FFF.
# Déclenchement : manuel (workflow_dispatch) uniquement.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Indexer les médias
        run: node tools/index-media.mjs || echo "⚠️ index médias échoué — ignoré"
      - name: Commit si modification
        run: |
          if ! git diff --quiet; then
            git config user.name "bot-classement"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "auto: index médias — $(date -u +%Y-%m-%d)"
            git push
            echo "✅ Mise à jour poussée."
          else
            echo "ℹ️ Aucun changement."
          fi
